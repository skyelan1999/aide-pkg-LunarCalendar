px}.solar-note p{font-size:13px;margin:3px 0}.day-heading{justify-content:space-between;gap:10px;padding-bottom:20px;border-bottom:1px solid var(--line)}#daily-title{font-size:27px}#lunar-title{font-size:12px;color:var(--muted);margin:10px 0 0}#day-number{font:normal 69px/.95 Georgia,serif;letter-spacing:-4px;color:var(--accent);font-variant-numeric:tabular-nums}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0}.tag{background:var(--hover);border-radius:5px;padding:3px 7px;color:var(--muted);font-size:11px}.yi-ji{display:grid;grid-template-columns:1fr 1fr;gap:12px}.yi-ji section{padding:14px;border-radius:11px;min-width:0}.yi{background:var(--good-bg);color:var(--good)}.ji{background:var(--bad-bg);color:var(--bad)}h3{font-size:11px;font-weight:500;margin:0 0 12px}h3 span{font:600 20px Georgia,serif;margin-right:6px}.chips{display:flex;gap:6px 10px;flex-wrap:wrap;font-size:12px;line-height:1.8}.facts{margin:20px 0 0;font-size:12px}.facts>div{display:grid;grid-template-columns:65px 1fr;gap:14px;padding:11px 0;border-bottom:1px solid var(--line)}.facts dt{color:var(--muted)}.facts dd{margin:0;overflow-wrap:anywhere}.more{margin-top:15px}.more summary{font-size:12px;color:var(--muted);cursor:pointer;padding:6px 0}.more .facts{margin-top:0}.page-footer{color:var(--muted);font-size:10px;margin:25px 0 0;line-height:1.8}.page-footer>span{letter-spacing:1px}.page-footer p{margin:8px 0 4px}.page-footer small{font-size:10px}

</style></head><body><div class="app"><header class="masthead"><div class="identity"><span class="seal" aria-hidden="true">月</span><div><h1>农历 <span>LUNAR CALENDAR</span></h1><p>公历与农历，一眼对照</p></div></div><div class="header-meta"><span class="zone">中国标准时间 · UTC+8</span><button id="theme" type="button" class="quiet" aria-label="切换明暗主题">明 / 暗</button></div></header><p id="notice" role="status" aria-live="polite">正在连接农历工具…</p>
<main id="content" aria-busy="true"><section class="calendar panel"><div class="calendar-heading"><div><p class="eyebrow">公历 / 农历</p><h2 id="month-title">月历</h2></div><div class="month-actions"><button id="prev-month" type="button" aria-label="上个月">‹</button><button id="today" type="button">今天</button><button id="next-month" type="button" aria-label="下个月">›</button></div></div><div id="date-form"><label for="date">查看日期</label><input id="date" type="date" min="1901-01-01" max="2099-12-31" required><button id="go" type="button">查看</button></div><div class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="days" class="days" role="group" aria-label="月历日期"></div><div class="calendar-footer"><span>支持1901–2099年 · 键盘方向键选日</span></div></section>
<section class="daily panel"><div class="day-heading"><div><p class="eyebrow" id="selected-date">所选日期</p><h2 id="daily-title">农历日期</h2><p id="lunar-title"></p></div><strong id="day-number" aria-hidden="true">—</strong></div><div class="tags" id="day-tags"></div><dl class="facts" id="facts"></dl><details class="more"><summary>历法来源与校验口径</summary><p class="muted" id="source-note"></p><p class="muted">干支年与生肖按正月初一换年，不混用立春年界。日期来自固定版本历表，不依赖宿主ICU农历版本；远期朔或节气接近午夜时可能存在日期不确定性。</p></details></section></main><footer class="page-footer">香港天文台公历与农历对照表 · 离线查询 · 与 Aide 工具同源<br>本插件为独立实现，不代表香港天文台认证；不含官方调休安排。</footer></div><script>'use strict';

(function(){
 function create(pluginId){
  if(typeof pluginId!=='string'||!/^[A-Za-z0-9_-]{1,64}$/.test(pluginId))throw Error('Invalid plugin id');
  let port=null,tools=[],capabilities=[],next=0,connecting=null,settle=null,closed=false;const pending=new Map(),listeners=new Set();

   port=e.ports[0];tools=m.tools.slice();capabilities=Array.isArray(m.capabilities)?m.capabilities.filter(x=>typeof x==='string').slice(0,16):[];port.onmessage=event=>{const value=event.data;if(value?.event==='scope.revoked'){revoke('Host scope revoked; verify effects before retry');return;}if(value?.event){for(const listener of listeners)listener(value);return;}const p=pending.get(value?.requestId);if(!p)return;pending.delete(value.requestId);clearTimeout(p.timer);if(value.status==='error')p.reject(Error(value.error||'Host call failed'));else p.resolve(value);};port.start();clearTimeout(settle?.timer);settle?.resolve({protocol:1,tools:tools.slice(),capabilities:capabilities.slice()});settle=null;
  }

</script><script>'use strict';
(()=>{const $=id=>document.getElementById(id),bridge=AideWorkbenchClient.create('lunar-calendar');let current,calendar,busy=false,disposed=false;
const node=(tag,cls,text)=>{const e=document.createElement(tag);e.className=cls||'';if(text!==undefined)e.textContent=text;return e;},notice=text=>{if(disposed)return;$('notice').textContent=text;$('notice').hidden=!text;};
const fact=(label,value)=>{const row=node('div');row.append(node('dt','',label),node('dd','',value));$('facts').append(row);};
function offset(date,days){const d=new Date(date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+days);return d.toISOString().slice(0,10);}
function monthOffset(delta){const [y,m,d]=current.gregorianDate.split('-').map(Number),n=new Date(Date.UTC(y,m-1+delta,1));n.setUTCDate(Math.min(d,new Date(Date.UTC(n.getUTCFullYear(),n.getUTCMonth()+1,0)).getUTCDate()));return n.toISOString().slice(0,10);}
async function call(tool,args){const r=await bridge.call(tool,args);if(r.status!=='result')throw Error('未收到查询结果');return r.result;}
async function load(date,focus=false){if(disposed||busy)return;if(date!==undefined&&(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date<'1901-01-01'||date>'2099-12-31')){notice('支持1901–2099年，日期格式为YYYY-MM-DD');return;}busy=true;$('content').setAttribute('aria-busy','true');for(const e of document.querySelectorAll('main button,main input'))e.disabled=true;notice('正在查询…');try{const q=await call('get_lunar_date',date===undefined?{}:{date}),[year,month]=q.gregorianDate.split('-').map(Number),m=calendar?.year===year&&calendar?.month===month?calendar:await call('get_lunar_month',{year,month});if(disposed)return;current=q;calendar=m;render();notice('');if(focus)document.querySelector(`[data-date="${q.gregorianDate}"]`)?.focus();}catch(e){notice('查询失败：'+e.message);}finally{if(!disposed){busy=false;$('content').setAttribute('aria-busy','false');for(const e of document.querySelectorAll('main button,main input'))e.disabled=false;$('prev-month').disabled=calendar?.year===1901&&calendar?.month===1;$('next-month').disabled=calendar?.year===2099&&calendar?.month===12;}}}
function render(){const q=current;$('month-title').textContent=`${calendar.year} 年 ${calendar.month} 月`;$('date').value=q.gregorianDate;$('selected-date').textContent=q.gregorianDate;$('daily-title').textContent=q.lunarMonth+q.lunarDayName;$('lunar-title').textContent=q.ganzhiYear+'年 · '+q.zodiac+'年';$('day-number').textContent=q.gregorianDate.slice(-2);$('day-tags').replaceChildren(node('span','tag',q.isLeapMonth?'闰月':'常规月份'),node('span','tag','官方历表口径'));$('facts').replaceChildren();fact('公历',q.gregorianDate);fact('农历',q.lunarDate);fact('农历年',String(q.lunarYear));fact('本月天数',q.daysInMonth+' 天');fact('时区',q.timeZone);fact('节气',calendar.days.find(d=>d.date===q.gregorianDate)?.solarTerm||'当日无节气交接');$('source-note').textContent=q.source.name+' · 数据版本 '+q.source.retrieved+' · '+q.source.url;
$('days').replaceChildren();for(let i=1;i<calendar.firstWeekday;i++)$('days').append(node('span','empty'));
for(const d of calendar.days){const b=node('button',(d.date===calendar.today?'today ':'')+(d.solarTerm?'term':''));b.type='button';b.dataset.date=d.date;b.tabIndex=d.date===q.gregorianDate?0:-1;b.setAttribute('aria-pressed',String(d.date===q.gregorianDate));b.setAttribute('aria-label',d.date+' '+d.lunar.monthName+d.lunar.dayName);b.append(node('span','number',d.day),node('span','lunar',d.solarTerm||(d.lunar.day===1?d.lunar.monthName:d.lunar.dayName)));b.onclick=()=>load(d.date);b.onkeydown=e=>{const moves={ArrowLeft:-1,ArrowRight:1,ArrowUp:-7,ArrowDown:7,Home:1-d.weekday,End:7-d.weekday};if(e.key in moves){e.preventDefault();void load(offset(d.date,moves[e.key]),true);}};$('days').append(b);}}
$('go').onclick=()=>{if($('date').reportValidity())void load($('date').value);};$('date').onkeydown=e=>{if(e.key==='Enter')$('go').click();};$('today').onclick=()=>load();$('prev-month').onclick=()=>load(monthOffset(-1));$('next-month').onclick=()=>load(monthOffset(1));$('theme').onclick=()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
function theme(e){if(e.source!==parent||e.data?.type!=='aide.workbench.theme'||e.data.protocol!==1)return;document.documentElement.dataset.theme=e.data.theme==='dark'?'dark':'light';document.documentElement.dataset.palette=e.data.palette;}
addEventListener('message',theme);parent.postMessage({type:'aide.workbench.theme.ready',protocol:1},'*');bridge.onEvent(e=>{if(e.event==='scope.revoked'){notice('授权已变化，请重新打开工作台');disposed=true;for(const e of document.querySelectorAll('main button,main input'))e.disabled=true;}});addEventListener('pagehide',()=>{disposed=true;removeEventListener('message',theme);bridge.close();});void load();})();
