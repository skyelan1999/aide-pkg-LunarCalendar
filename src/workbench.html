<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>农历工作台</title><style>/* CSS */</style></head><body><div class="app"><header class="masthead"><div class="identity"><span class="seal" aria-hidden="true">月</span><div><h1>农历 <span>LUNAR CALENDAR</span></h1><p>公历与农历，一眼对照</p></div></div><div class="header-meta"><span class="zone">中国标准时间 · UTC+8</span><button id="theme" type="button" class="quiet" aria-label="切换明暗主题">明 / 暗</button></div></header><p id="notice" role="status" aria-live="polite">正在连接农历工具…</p>
<main id="content" aria-busy="true"><section class="calendar panel"><div class="calendar-heading"><div><p class="eyebrow">公历 / 农历</p><h2 id="month-title">月历</h2></div><div class="month-actions"><button id="prev-month" type="button" aria-label="上个月">‹</button><button id="today" type="button">今天</button><button id="next-month" type="button" aria-label="下个月">›</button></div></div><div id="date-form"><label for="date">查看日期</label><input id="date" type="date" min="1901-01-01" max="2099-12-31" required><button id="go" type="button">查看</button></div><div class="weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="days" class="days" role="group" aria-label="月历日期"></div><div class="calendar-footer"><span>支持1901–2099年 · 键盘方向键选日</span></div></section>
<section class="daily panel"><div class="day-heading"><div><p class="eyebrow" id="selected-date">所选日期</p><h2 id="daily-title">农历日期</h2><p id="lunar-title"></p></div><strong id="day-number" aria-hidden="true">—</strong></div><div class="tags" id="day-tags"></div><dl class="facts" id="facts"></dl><details class="more"><summary>历法来源与校验口径</summary><p class="muted" id="source-note"></p><p class="muted">干支年与生肖按正月初一换年，不混用立春年界。日期来自固定版本历表，不依赖宿主ICU农历版本；远期朔或节气接近午夜时可能存在日期不确定性。</p></details></section></main><footer class="page-footer">香港天文台公历与农历对照表 · 离线查询 · 与 Aide 工具同源<br>本插件为独立实现，不代表香港天文台认证；不含官方调休安排。</footer></div><script>/* BRIDGE */</script><script>/* JS */</script></body></html>
